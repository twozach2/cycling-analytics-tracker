appId: com.twozach.cycling-analytics
productName: Cycling Analytics
artifactName: Cycling-Analytics-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Zach Tolen

directories:
  output: dist-installers
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - "**/*"
  - from: public/cycling-analytics-icon-512.png
    to: cycling-analytics-icon-512.png
  - from: resources/brouter
    to: brouter
    filter:
      - "**/*"

asar: true
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/**/*

electronLanguages:
  - en-US

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/cycling-analytics-app-icon.png
  executableName: Cycling Analytics

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cycling Analytics
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: public/cycling-analytics-app-icon.png
  category: public.app-category.healthcare-fitness
  hardenedRuntime: true
  notarize: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: public/cycling-analytics-app-icon.png
  category: Utility
  maintainer: Zach Tolen
  synopsis: Private cycling analytics and training guidance
  description: Import cycling activities, analyze training trends, and plan rides with explainable local-first guidance.
  syncDesktopName: true
